<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f2f2f3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>News | Hadeon Robotics</title>
    <link rel="icon" type="image/svg+xml" href="/images/HadeonLogo.svg">
    <link rel="apple-touch-icon" href="/images/HadeonLogo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="news">
<div id="nav-mount"></div>

<main>
  <section style="border-bottom:1px solid var(--color-divider)">
    <div class="container" style="padding:64px clamp(20px,4vw,32px) 48px">
      <h6 style="color:var(--color-accent-700);margin:0 0 12px">News</h6>
      <h1 style="font-size:clamp(44px,5.2vw,68px);line-height:1;margin:0 0 16px">Hadeon updates</h1>
      <p style="font-size:21px;max-width:52ch;margin:0;color:color-mix(in srgb, var(--color-text) 75%, transparent)">Funding, partnerships, research and updates from the team building the engine.</p>
    </div>
  </section>
  <section>
    <div class="container" style="padding:56px clamp(20px,4vw,32px) 80px">
      <div id="news-container">
        <div class="blueprint empty-state">
          <div class="kicker">No entries yet</div>
          <h3>First Post Lands with the Benchmark Release</h3>
          <p>We're preparing the Link6 cycle-time write-up. Ask for it early and we'll send it when it's out.</p>
          <a class="btn btn-secondary" href="mailto:info@hadeonrobotics.com?subject=Benchmark%20Write-up" style="padding:10px 20px;font-size:16px;letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap">Request the write-up</a>
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="footer-mount"></div>
<script src="/js/components.js"></script>
<script src="/js/news.js"></script>
</body>
</html>
