<!--
    HOW TO CREATE A NEW POST:
    1. Copy this file and rename it, e.g. news/my-announcement.html
    2. Replace [Post Title], [Year], and the article content below
    3. Add an entry to the FRONT of /data/news.json (newest first):
       { "title": "My Announcement", "date": "2026", "summary": "One-line summary.", "slug": "my-announcement" }
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f2f2f3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>[Post Title] | Hadeon Robotics News</title>
    <link rel="icon" type="image/svg+xml" href="/images/HadeonLogo.svg">
    <link rel="apple-touch-icon" href="/images/HadeonLogo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="news">
<div id="nav-mount"></div>

<main>
  <section style="border-bottom:1px solid var(--color-divider)">
    <div class="container" style="padding:64px clamp(20px,4vw,32px) 40px;max-width:760px">
      <div style="font-size:14px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:12px">[Year]</div>
      <h1 style="font-size:clamp(36px,4.6vw,52px);line-height:1.1;margin:0">[Post Title]</h1>
    </div>
  </section>
  <section>
    <div class="container" style="padding:48px clamp(20px,4vw,32px) 80px;max-width:760px">
      <article class="post-body">
        <p>Your article content goes here. This is the opening paragraph — make it compelling.</p>
        <p>Add more paragraphs as needed. Use <strong>strong</strong> for emphasis.</p>
      </article>
      <a href="/news.html" style="display:inline-flex;align-items:center;gap:8px;margin-top:40px;font-family:var(--font-heading);font-size:16px;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none;color:var(--color-text)">← Back to news</a>
    </div>
  </section>
</main>

<div id="footer-mount"></div>
<script src="/js/components.js"></script>
</body>
</html>
